name: Update Team Strength Model and README

on:
  # schedule:
    # 8:00 UTC every Tuesday during football season (Sep-Dec, Jan-Feb)
    # - cron: '0 8 * 9,10,11,12 2'
    # - cron: '0 8 * 1,2 2'
  workflow_dispatch:

jobs:
  run-model:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages (dependencies)
        run: |
          Rscript -e 'install.packages(c(
            "remotes",
            "posterior",
            "tidybayes",
            "arrow",
            "dplyr",
            "lubridate",
            "piggyback",
            "purrr",
            "stringr",
            "readr",
            "tibble",
            "tidyr",
            "glue",
            "slider",
            "nflreadr",
            "nflfastR",
            "nflseedR",
            "distributional",
            "ggdist",
            "bayesplot",
            "patchwork",
            "nflplotR",
            "jsonlite"
          ), repos = "https://cloud.r-project.org")'
          Rscript -e 'install.packages("cmdstanr", repos = c("https://stan-dev.r-universe.dev", getOption("repos")))'

      - name: Install CmdStan
        run: |
          Rscript -e 'cmdstanr::check_cmdstan_toolchain(fix = TRUE, quiet = TRUE)'
          Rscript -e 'cmdstanr::install_cmdstan(cores = parallel::detectCores(), quiet = TRUE)'

      - name: Install Stan model packages
        run: |
          Rscript -e 'remotes::install_github(c(
            "TylerPollard410/nflendzoneModel",
            "TylerPollard410/nflendzone"
          ))'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      - name: Run team strength model pipeline
        run: |
          mkdir -p artifacts/model-archive/team_strength
          Rscript data-raw/update_team_strength_model.R

      - name: Render weekly report
        run: |
          quarto render README.qmd

      - name: Commit and push updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add man/figures/
          git commit -m "Update model and weekly report [skip ci] $(TZ='America/New_York' date '+%Y-%m-%d %H:%M %Z')" || echo "No changes to commit"
          git push origin HEAD