name: Update EndZone Data

on:
  schedule:
    # 8:00 UTC is 4:00 AM US Eastern (NFL season)
    - cron: '0 8 * 9,10,11,12 *'   # September–December
    - cron: '0 8 * 1,2 *'          # January–February
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Run a full build (TRUE) or incremental (FALSE)?'
        required: false
        default: 'FALSE'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_github("ropensci/piggyback")'
          Rscript -e 'install.packages(c(
            "arrow", "tibble", "glue", "dplyr", "readr", "purrr",
            "stringr", "lubridate", "slider", "tidyr",
            "nflreadr", "nflfastR", "nflseedR", "gh", "httr2"
          ))'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      # artifacts/data-archive/ is not tracked in git (it bloated the repo history).
      # Restore the prior full-archive .rds files from nflendzoneData releases so
      # the ETL can run incrementally. Missing assets are skipped (full rebuild).
      - name: Restore prior data archive from releases
        run: |
          Rscript - <<'RSCRIPT'
          repo <- "TylerPollard410/nflendzoneData"
          tags <- c(
            "nfl_stats_week_team_regpost", "nfl_stats_week_player_regpost",
            "nfl_stats_season_team_regpost", "nfl_stats_season_player_regpost",
            "season_standings", "weekly_standings", "elo", "srs", "epa",
            "scores", "series", "turnover", "redzone",
            "team_features", "game_features", "team_model", "game_model"
          )
          for (tag in tags) {
            dest <- file.path("artifacts", "data-archive", tag)
            dir.create(dest, recursive = TRUE, showWarnings = FALSE)
            tryCatch(
              piggyback::pb_download(
                file = paste0(tag, ".rds"),
                dest = dest,
                repo = repo,
                tag = tag,
                overwrite = TRUE
              ),
              error = function(e) message("Could not restore ", tag, ": ", conditionMessage(e))
            )
          }
          RSCRIPT

      - name: Run ETL pipeline
        run: |
          Rscript data-raw/update_all_data.R ${{ github.event.inputs.full_build }}
