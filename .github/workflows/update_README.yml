name: Update README

on:
  schedule:
    # 10:00 UTC every Tuesday during football season (Sep–Dec, Jan–Feb)
    - cron: '0 10 * 9,10,11,12 2'
    - cron: '0 10 * 1,2 2'
  workflow_dispatch:

jobs:
  render-readme:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install system dependencies (README + package deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libmagick++-dev
          # Toolchain needed for source builds like arrow (keep gfortran optional)
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake
          # sudo apt-get install -y --no-install-recommends gfortran  # optional

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages (dependencies)
        run: |
          Rscript - <<'RSCRIPT'
          install.packages(c(
            # Core data manipulation
            "dplyr",
            "purrr",
            "stringr",
            # "readr",      # optional
            # "lubridate",  # optional

            # Plotting and colors
            "ggplot2",
            "ggdist",
            "colorspace",
            # "bayesplot",  # optional
            # "patchwork",  # optional

            # Bayesian random variables
            "posterior",
            # "distributional", # optional
            # "tidybayes",      # optional

            # NFL packages and related
            "nflreadr",
            "nflplotR",

            # Dependencies package pulls in
            "arrow",
            "future",
            "progressr",
            "readr",
            "slider",
            "nflfastR",
            "nflseedR",

            # Image handling used by nflplotR
            "magick",
            "ggpath",

            # Utilities
            "jsonlite","remotes"
          ), repos = "https://cloud.r-project.org")
          RSCRIPT

      - name: Install GitHub packages
        run: |
          Rscript -e 'remotes::install_github(c(
            "TylerPollard410/nflendzoneModel",
            "TylerPollard410/nflendzone"
          ))'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      - name: Verify required packages
        run: |
          Rscript -e 'pkgs <- c("dplyr","purrr","stringr","ggplot2","ggdist","colorspace","posterior","nflreadr","nflplotR","magick","ggpath","arrow","jsonlite"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if(length(missing)) stop("Missing packages: ", paste(missing, collapse=", "))'

      - name: Render README
        run: |
          quarto render README.qmd

      - name: Commit and push README updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.qmd README.md man/figures/
          git commit -m "Render README [skip ci] $(TZ='America/New_York' date '+%Y-%m-%d %H:%M %Z')" || echo "No changes to commit"
          git push origin HEAD