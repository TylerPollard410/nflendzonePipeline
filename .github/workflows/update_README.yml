name: Update README

on:
  schedule:
    # 8:00 UTC every Tuesday during football season (Sep-Dec, Jan-Feb)
    - cron: '0 10 * 9,10,11,12 2'
    - cron: '0 10 * 1,2 2'
  workflow_dispatch:

jobs:
  render-readme:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      # System dependencies required for README rendering (fonts/images/network/XML)
      - name: Install system dependencies (minimal for README)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            # build-essential \   # optional: needed for Stan/C++ builds
            # cmake \             # optional: needed for Stan/C++ builds
            # gfortran \          # optional: needed for Stan/C++ builds
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Install R packages with inline comments; uncomment as needed
      - name: Install R packages (dependencies)
        run: |
          Rscript - <<'RSCRIPT'
          install.packages(c(
            # Core data manipulation
            "dplyr",
            "purrr",
            "stringr",
            # "readr",      # optional: file I/O helpers
            # "lubridate",  # optional: date/time tools

            # Plotting and colors
            "ggplot2",
            "ggdist",
            "colorspace",
            # "bayesplot",  # optional: Bayesian plotting helpers
            # "patchwork",  # optional: plot composition

            # Bayesian random variables and helpers
            "posterior",
            # "distributional", # optional: distributions/rvars
            # "tidybayes",      # optional: tidy extraction of Bayesian fits

            # NFL packages and related
            "nflreadr",
            "nflplotR",
            # "nflfastR",  # optional: play-by-play data
            # "nflseedR",  # optional: seeding utilities

            # Utilities used via :: (keep for dependency resolution)
            "jsonlite",
            "remotes"
          ), repos = "https://cloud.r-project.org")
          RSCRIPT

      # Optional: cmdstanr for Stan builds (commented out for README-only)
      # - name: Install cmdstanr (optional)
      #   run: |
      #     Rscript -e 'install.packages("cmdstanr", repos = c("https://stan-dev.r-universe.dev", getOption("repos")))'

      # Optional: install CmdStan (commented out for README-only)
      # - name: Install CmdStan (optional)
      #   run: |
      #     Rscript -e 'cmdstanr::check_cmdstan_toolchain(fix = TRUE, quiet = TRUE)'
      #     Rscript -e 'cmdstanr::install_cmdstan(cores = parallel::detectCores(), quiet = TRUE)'

      - name: Install Stan model packages
        run: |
          Rscript -e 'remotes::install_github(c(
            "TylerPollard410/nflendzoneModel",
            "TylerPollard410/nflendzone"
          ))'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      # Optional: run the full model pipeline (commented out for README-only)
      # - name: Run team strength model pipeline (optional)
      #   run: |
      #     mkdir -p artifacts/model-archive/team_strength
      #     Rscript data-raw/update_team_strength_model.R

      - name: Render README
        run: |
          quarto render README.qmd

      - name: Commit and push README updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md man/figures/
          git commit -m "Render README [skip ci] $(TZ='America/New_York' date '+%Y-%m-%d %H:%M %Z')" || echo "No changes to commit"
          git push origin HEAD