name: Update Team Strength NegBinom Summary

on:
  schedule:
    # 9:30 UTC every Tuesday during football season, after the regular model job.
    - cron: '30 9 * 9,10,11,12 2'
    - cron: '30 9 * 1,2 2'
  workflow_dispatch:

jobs:
  run-negbinom-summary:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages (dependencies)
        run: |
          Rscript -e 'install.packages(c(
            "remotes",
            "arrow",
            "dplyr",
            "piggyback",
            "purrr",
            "stringr",
            "readr",
            "tibble",
            "tidyr",
            "glue",
            "slider",
            "nflreadr",
            "nflfastR",
            "nflseedR"
          ), repos = "https://cloud.r-project.org")'
          Rscript -e 'install.packages("cmdstanr", repos = c("https://stan-dev.r-universe.dev", getOption("repos")))'

      - name: Install CmdStan
        run: |
          Rscript -e 'cmdstanr::check_cmdstan_toolchain(fix = TRUE, quiet = TRUE)'
          Rscript -e 'cmdstanr::install_cmdstan(cores = parallel::detectCores(), quiet = TRUE)'

      - name: Install Stan model packages
        run: |
          Rscript -e 'remotes::install_github("TylerPollard410/nflendzoneModel")'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      - name: Run negative binomial summary pipeline
        run: |
          Rscript data-raw/update_team_strength_negbinom_summary.R
