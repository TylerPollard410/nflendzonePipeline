name: Update Team Strength Model

on:
  schedule:
    # 8:00 UTC every Tuesday during football season (Sep-Dec, Jan-Feb)
    - cron: '0 8 * 9,10,11,12 2'
    - cron: '0 8 * 1,2 2'
  workflow_dispatch:

jobs:
  run-model:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.PUSH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "remotes", "cmdstanr", "posterior", "tidybayes", "arrow",
            "dplyr", "lubridate", "piggyback", "purrr", "stringr",
            "readr", "tibble", "tidyr", "glue", "nflreadr",
            "nflfastR", "nflseedR"
          ), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github(c(
            "TylerPollard410/nflendzoneModel",
            "TylerPollard410/nflendzone"
          ))'
          Rscript -e 'install.packages(".", repos = NULL, type = "source")'

      - name: Run team strength model pipeline
        run: |
          Rscript data-raw/update_team_strength_model.R
